<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Pack Ramadan 1447H | Surau Seri Putra</title>
    <style>
        :root {
            --primary: #1a5c38;
            --gold: #c9922a;
            --bg: #f5f0e8;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg);
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }

        /* Navigation Bar */
        .nav-header {
            background: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid var(--gold);
            height: 60px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            height: 40px;
            width: 40px;
            border-radius: 50%;
            border: 1px solid var(--gold);
        }

        .title-text h1 {
            margin: 0;
            font-size: 16px;
            color: var(--primary);
            text-transform: uppercase;
        }

        .btn-back {
            text-decoration: none;
            background: var(--gold);
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Loader */
        #loader {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* PDF Container */
        .pdf-wrapper {
            width: 100%;
            height: calc(100vh - 60px);
            background: #525659;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header class="nav-header">
        <div class="logo-section">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRk6d5ZFsWgltl3x82ywVcjgFMZHct2LBjVQg&s" class="logo-img">
            <div class="title-text">
                <h1>Info Pack Ramadan 1447H</h1>
            </div>
        </div>
        <a href="index.html" class="btn-back">⬅️ UTAMA</a>
    </header>

    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top:10px; color:var(--primary);">Mencari Dokumen Terkini...</p>
    </div>

    <main class="pdf-wrapper">
        <iframe id="pdfViewer" src="" allow="autoplay"></iframe>
    </main>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwkKRLbbPMHZmvVw4N6iAYiVdzq0Kg56tmhRfUQABqjT92Hzfrd-YCSyKB71HczkjmI/exec';

        async function loadPdf() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();

                if (data.infoPackId) {
                    document.getElementById('pdfViewer').src = `https://drive.google.com/file/d/${data.infoPackId}/preview`;
                    // Hide loader once the iframe starts loading
                    setTimeout(() => {
                        document.getElementById('loader').style.display = 'none';
                    }, 1000);
                } else {
                    document.getElementById('loader').innerHTML = "<p>Gagal mencari fail. Sila pastikan nama fail adalah betul.</p>";
                }
            } catch (error) {
                console.error("Error fetching PDF ID:", error);
                document.getElementById('loader').innerHTML = "<p>Ralat sambungan. Sila cuba lagi.</p>";
            }
        }

        window.onload = loadPdf;
    </script>
</body>
</html>
