    <style>

        /* Amil Zakat Floating Button */
        .amil-zakat-float {
            position: absolute;
            top: 5px;
            right: 10px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            padding: 10px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.52rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
            overflow: hidden;
        }

            /* Shimmer sweep effect */
            .amil-zakat-float::before {
                content: '';
                position: absolute;
                top: 0;
                left: -75%;
                width: 50%;
                height: 100%;
                background: linear-gradient( 120deg, transparent, rgba(255, 255, 255, 0.25), transparent );
                animation: shimmer 2.8s infinite;
            }

            /* Pulse ring */
            .amil-zakat-float::after {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: 50px;
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5);
                animation: pulse-ring 2s ease-out infinite;
            }

        @keyframes shimmer {
            0% {
                left: -75%;
            }

            60% {
                left: 125%;
            }

            100% {
                left: 125%;
            }
        }

        @keyframes pulse-ring {
            0% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.45);
            }

            70% {
                box-shadow: 0 0 0 8px rgba(37, 211, 102, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
            }
        }

        .amil-zakat-float:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 8px 22px rgba(37, 211, 102, 0.5);
            background: linear-gradient(135deg, #2edb6f, #15a882);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .amil-zakat-float:active {
            transform: translateY(0px) scale(0.97);
            box-shadow: 0 3px 10px rgba(37, 211, 102, 0.3);
        }

        /* Emoji icon */
        .amil-zakat-float .az-icon {
            font-size: 1.2rem;
            line-height: 1;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
            animation: wiggle 3s ease-in-out infinite;
        }

            .amil-zakat-float .az-icon i {
                display: block;
                line-height: 1;
            }

        @keyframes wiggle {
            0%, 80%, 100% {
                transform: rotate(0deg);
            }

            85% {
                transform: rotate(-12deg);
            }

            92% {
                transform: rotate(10deg);
            }

            97% {
                transform: rotate(-6deg);
            }
        }

        /* Label text */
        .amil-zakat-float .az-label {
            position: relative;
            z-index: 1;
            text-shadow: 0 1px 3px rgba(0,0,0,0.15);
        }
        /* Pulsing effect for the clickable stats */

        .clickable-stats {
            cursor: pointer;
            position: relative;
            padding: 4px 10px;
            background: rgba(201, 146, 42, 0.12);
            border-radius: 8px;
            border: 1px solid var(--gold);
            transition: all 0.3s ease;
            animation: pulse-border 2s infinite;
        }

            .clickable-stats:hover {
                background: var(--gold);
                color: var(--primary) !important;
            }

        @keyframes pulse-border {
            0% {
                box-shadow: 0 0 0 0 rgba(201, 146, 42, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(201, 146, 42, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(201, 146, 42, 0);
            }
        }

        /* Themed Status Grid */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .status-item {
            background: rgba(255, 255, 255, 0.05);

        /* Progress Bar Styling */
        .progress-container {
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            height: 12px;
            width: 100%;

            background: #e1e1e1;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;

            border-radius: 8px;

        }

        @keyframes skeleton-loading {
            0% {
                background-position: 200% 0;
            }

            100% {

        }

        /* NEW: Floating Gold Notification Banner */
        .notification-banner {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            background: linear-gradient(135deg, var(--gold) 0%, #e8b84d 100%);
            color: var(--primary);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(201, 146, 42, 0.6);
            z-index: 10000;
            font-weight: 800;
            font-size: 1.2rem;
            text-align: center;
            transition: transform 0.5s ease-in-out;
            animation: banner-pulse 2s infinite;
        }

            .notification-banner.show {
                transform: translateX(-50%) translateY(0);
            }

        @keyframes banner-pulse {
            0%, 100% {
                box-shadow: 0 10px 40px rgba(201, 146, 42, 0.6);
            }

            50% {
                box-shadow: 0 10px 60px rgba(201, 146, 42, 0.9);
            }
        }

        /* NEW: Live Countdown Pulsing Effect */
        .prayer-time.countdown-active {
            animation: countdown-pulse 1s infinite;
            background: rgba(201, 146, 42, 0.25) !important;
            border: 3px solid var(--gold) !important;
            box-shadow: 0 0 30px rgba(201, 146, 42, 0.5);
        }

        @keyframes countdown-pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 30px rgba(201, 146, 42, 0.5);
            }

            50% {
                transform: scale(1.03);
                box-shadow: 0 0 50px rgba(201, 146, 42, 0.8);
            }
        }

        .countdown-text {
            font-size: 1.1rem;
            color: var(--gold);
            font-weight: 900;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(201, 146, 42, 0.5);
            animation: text-pulse 1s infinite;
        }

        @keyframes text-pulse {
            0%, 100% {
                opacity: 1;
            }

            50% {

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwkKRLbbPMHZmvVw4N6iAYiVdzq0Kg56tmhRfUQABqjT92Hzfrd-YCSyKB71HczkjmI/exec';

        function renderAdminDonationList() {
            const listArea = document.getElementById('adminDonationContainer');

            let html = '';
            adminDonationList.forEach(item => {
                html += `
                    <div class="don-item-row" style="flex-direction: column; align-items: flex-start;">

                        </div>

                        </div>
                    </div>`;
            });
            listArea.innerHTML = html;
        }

        async function deleteDonationEntry(id) {
            if (!confirm("Adakah anda pasti mahu memadam rekod ini?")) return;

            const status = document.getElementById('financeStatus');
            status.innerText = "Memadam...";

            const payload = {
                type: "delete_donation",
                id: id,
                password: document.getElementById('adminPassword').value
            };

            try {
                const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.text();
                if (result === "Success") {
                    status.style.color = "green";
                    status.innerText = "✅ Rekod berjaya dipadam.";
                    await loadData(); // Refresh the list and totals
                } else {
                    status.style.color = "red";
                    status.innerText = "❌ Gagal memadam.";
                }
            } catch (e) {
                status.style.color = "red";
                status.innerText = "❌ Ralat sambungan.";
            }
        }

        function editDonationEntry(id) {
            const entry = adminDonationList.find(i => i.id === id);
            if (entry) {
                document.getElementById('donCategory').value = entry.category;
                document.getElementById('donAmount').value = entry.amount;
                document.getElementById('donDonorName').value = entry.donorName;
                document.getElementById('donPayDate').value = entry.payDate; // Format YYYY-MM-DD
                document.getElementById('donSubmitBtn').innerText = "Kemaskini Resit";
                document.getElementById('donSubmitBtn').dataset.editId = id;
                document.getElementById('donSubmitBtn').dataset.existingFile = entry.fileUrl;
            }
        }

        function renderFinance(donations) {
            const totalEl = document.getElementById('totalDonation');
            const breakdownEl = document.getElementById('donationBreakdown');

            let total = 0;
            let html = '<div style="margin-top:15px; font-size:0.8rem;">';

            donations.forEach(don => {
                const amt = parseFloat(don.Amount) || 0;
                total += amt;
                html += `
                        <div style="display:flex; justify-content:between; border-bottom:1px solid #eee; padding:5px 0;">
                            <span style="flex:1">${don.Category}</span>
                            <span style="font-weight:bold">RM ${amt.toFixed(2)}</span>
                        </div>`;
            });

            html += '</div>';

            totalEl.innerText = `RM ${total.toFixed(2)}`;
            breakdownEl.innerHTML = html;
        }
        function renderUI(data) {
            // --- 1. INFO SUMBANGAN ---
            if (data.donations) {
                const donationSection = document.getElementById('donationSection');
                const totalEl = document.getElementById('totalDonation');
                const breakdownEl = document.getElementById('donationBreakdown');

                donationSection.classList.remove('hidden');

                if (data.donations.total !== undefined) {
                    totalEl.innerText = `RM ${data.donations.total.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                }

                // Jika anda mahu memaparkan pecahan kategori (opsional)
                if (data.donations.categories) {
                    let breakdownHtml = '<div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">';
                    data.donations.categories.forEach(cat => {
                        breakdownHtml += `
                            <div style="display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.85rem;">
                                <span style="color: var(--text-muted); font-weight: 600;">${cat.name}</span>
                                <span style="font-weight: 800; color: var(--primary);">RM ${cat.amount.toFixed(2)}</span>
                            </div>`;
                    });
                    breakdownHtml += '</div>';
                    breakdownEl.innerHTML = breakdownHtml;
                }
            }

            // --- 2. WAKTU SOLAT ---
            if (data.prayerTimes) {
                document.getElementById('prayerSection').classList.remove('hidden');
                document.getElementById('hijriDisplay').innerText = data.prayerTimes.hDate || "";
                const p = data.prayerTimes;
                const tMap = { imsak: p.imsak, subuh: p.subuh, zohor: p.zohor, asar: p.asar, maghrib: p.maghrib, isyak: p.isyak };

                for (const [id, time] of Object.entries(tMap)) {
                    const el = document.getElementById(`t-${id}`);
                    if (el) el.innerText = time || "-";
                }
                highlightCurrentSolat(tMap);
                // NEW: Start countdown checking
                startCountdownChecker();
            }

            // --- 3. JADUAL (SCHEDULE) ---
            slots = {};
            if (data.schedule) {
                data.schedule.forEach(item => {
                    if (item.SelectedDate) {
                        // Supabase menghantar '2026-02-18T00:00:00', kita potong kepada '2026-02-18'
                        const dateKey = item.SelectedDate.split('T')[0];
                        slots[dateKey] = item;
                    }
                });
            }

            if (data.schedule) {
                const totalDays = 30;
                // Count entries where HostName is not empty/null, excluding day 0 (Malam Tarawih)
                const sponsoredDays = data.schedule.filter(s =>
                    s.HostName && s.HostName.trim() !== "" && s.SelectedDate.split('T')[0] !== "2026-02-18"
                ).length;

                const percentage = (sponsoredDays / totalDays) * 100;

                // Update UI
                const bar = document.getElementById('iftharProgress');
                const text = document.getElementById('iftharCount');

                if (bar && text) {
                    bar.style.width = `${percentage}%`;
                    text.innerText = `${sponsoredDays} / ${totalDays} HARI DITAJA`;
                    text.className = "clickable-stats"; // Apply the new pulsing style
                    text.onclick = openStatusModal;
                }
            }
            render(); // Panggil fungsi render asal
        }

        function openStatusModal() {
            const container = document.getElementById('statusGridContainer');
            let html = '';

            // Arrays to match your main UI language and 2026 calendar
            const dayNames = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
            const monthNames = ['Jan', 'Feb', 'Mac', 'Apr'];

            // NEW: Get today's date for comparison
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            for (let i = 1; i <= 30; i++) {
                // Start from Feb 19, 2026 (1 Ramadhan)
                const dObj = new Date(2026, 1, 18 + i);

                const ds = `${dObj.getFullYear()}-${String(dObj.getMonth() + 1).padStart(2, '0')}-${String(dObj.getDate()).padStart(2, '0')}`;
                const s = slots[ds] || {};
                const isOccupied = s.HostName && s.HostName.trim() !== "";
                const dayLabel = dayNames[dObj.getDay()]; // Get the day name (e.g., Khamis)

                // NEW: Check if this date is in the past
                const isPast = dObj < today;

                html += `
            <div class="status-item ${isOccupied ? 'occupied' : 'available'}${isPast ? ' past-date' : ''}">
                <div class="status-info">
                    <div class="status-date">
                        <span style="color:var(--secondary)">${i} Ramadan</span>
                        <span style="color:var(--text-muted); font-weight:normal;">• ${dayLabel}, ${dObj.getDate()} ${monthNames[dObj.getMonth()]}</span>
                    </div>
                   <div class="status-host">
  ${(i === 29 || i === 30)
                        ? ''
                        : (isOccupied ? '✅ ' + s.HostName : '❌ Masih Kosong')}
</div>

                </div>
                <div>
                     ${isOccupied ?
                        '<span style="font-size: 1.2rem;">🍛</span>' :
                        (i === 29 || i === 30) ?
                            '<span style="font-size:0.7rem; color:#999;">Tiada Iftar</span>' :
                            `<button class="status-btn-small" onclick="closeModal('statusModal'); handleBooking('${ds}')">Tempah</button>`
    }
                </div>
            </div>`;
            }

            container.innerHTML = html;
            document.getElementById('statusModal').style.display = 'flex';
        }

        async function loadData() {
            const donationEl = document.getElementById('totalDonation');
            const gridEl = document.getElementById('scheduleGrid');

            // 1. Try to load from Cache first
            const cached = localStorage.getItem('surau_main_cache');
            if (cached) {
                try {
                    const data = JSON.parse(cached);
                    renderUI(data); // This fills the scheduleGrid and Donation section

                    // Remove skeletons if we have valid cached data
                    if (data.donations) donationEl.classList.remove('skeleton');
                } catch (e) { console.error("Cache error", e); }
            }

            try {
                // 2. Fetch fresh data
                const res = await fetch(SCRIPT_URL);
                const freshData = await res.json();

                // 3. Save to cache and refresh UI
                localStorage.setItem('surau_main_cache', JSON.stringify(freshData));
                renderUI(freshData);

                // 4. Remove all skeletons now that fresh data is here
                donationEl.classList.remove('skeleton');
            } catch (e) {
                console.error("Sync failed");
                // Remove skeletons even on failure so page isn't stuck shimmering
                donationEl.classList.remove('skeleton');
            }
        }
        function highlightCurrentSolat(times) {
            const now = new Date();

            const parseT = (tStr) => {
                if (!tStr || tStr === "-") return new Date(0);
                const [t, mod] = tStr.split(' ');
                let [h, m] = t.split(':');
                if (h === '12') h = '00';
                if (mod === 'PM') h = parseInt(h) + 12;
                const d = new Date();
                d.setHours(h, m, 0, 0);
                return d;
            };

            const order = ['imsak', 'subuh', 'zohor', 'asar', 'maghrib', 'isyak'];
            let current = '';

            // Determine current solat
            for (let i = 0; i < order.length; i++) {
                if (now >= parseT(times[order[i]])) current = order[i];
            }

            // 🕓 Remove highlight if Subuh > 2 hours ago
            if (current === 'subuh') {
                const subuhTime = parseT(times['subuh']);
                const msSinceSubuh = now - subuhTime;
                if (msSinceSubuh > 2 * 60 * 60 * 1000) {
                    current = '';
                }
            }

            // Update DOM highlight
            document.querySelectorAll('.solat-item').forEach(el => el.classList.remove('active-prayer'));
            if (current) {
                document.getElementById(`item-${current}`).classList.add('active-prayer');
            }
        }

        // NEW: Countdown and notification state
        let countdownInterval = null;
        let notificationShown = {};

        function startCountdownChecker() {
            if (countdownInterval) clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                checkPrayerCountdowns();
            }, 1000);
        }

        function checkPrayerCountdowns() {
            const now = new Date();

            // Get prayer times from current display
            const times = {
                imsak: document.getElementById('t-imsak')?.innerText,
                subuh: document.getElementById('t-subuh')?.innerText,
                zohor: document.getElementById('t-zohor')?.innerText,
                asar: document.getElementById('t-asar')?.innerText,
                maghrib: document.getElementById('t-maghrib')?.innerText,
                isyak: document.getElementById('t-isyak')?.innerText
            };

            const prayerOrder = ['imsak', 'subuh', 'zohor', 'asar', 'maghrib', 'isyak'];

            prayerOrder.forEach(prayer => {
                const timeStr = times[prayer];
                if (!timeStr || timeStr === '-') return;

                // Parse time (handle both 12hr and 24hr formats)
                const parseTime = (tStr) => {
                    if (!tStr || tStr === '-') return null;
                    const [t, mod] = tStr.split(' ');
                    let [h, m] = t.split(':').map(Number);
                    if (mod === 'PM' && h !== 12) h += 12;
                    if (mod === 'AM' && h === 12) h = 0;
                    const d = new Date(now);
                    d.setHours(h, m, 0, 0);
                    return d;
                };

                const prayerTime = parseTime(timeStr);
                if (!prayerTime) return;

                const diffMs = prayerTime - now;
                const diffMins = Math.floor(diffMs / 60000);

                const card = document.getElementById(`item-${prayer}`);

                if (!card) return;

                // Remove any existing countdown display
                let countdownEl = card.querySelector('.countdown-display');
                if (!countdownEl) {
                    countdownEl = document.createElement('div');
                    countdownEl.className = 'countdown-display countdown-text';
                    const timeDiv = card.querySelector('.solat-time');
                    if (timeDiv) {
                        timeDiv.parentNode.insertBefore(countdownEl, timeDiv.nextSibling);
                    }
                }

                // Within 10 minutes before prayer time
                if (diffMins >= 0 && diffMins < 10) {
                    card.classList.add('countdown-active');
                    const mins = Math.floor(diffMs / 60000);
                    const secs = Math.floor((diffMs % 60000) / 1000);
                    countdownEl.textContent = `⏰${mins}:${secs}s`;
                    countdownEl.style.display = 'block';
                } else {
                    card.classList.remove('countdown-active');
                    countdownEl.style.display = 'none';
                }

                // Exactly at prayer time (within 2 second tolerance for better detection)
                if (diffMs >= -1000 && diffMs <= 1000 && !notificationShown[prayer]) {
                    showNotification(prayer);
                 
                    notificationShown[prayer] = true;

                    setTimeout(() => {
                        location.reload();
                    }, 15000);

                    // Reset after 2 minutes
                    setTimeout(() => {
                        notificationShown[prayer] = false;
                    }, 120000);
                }
            });
        }

        function showNotification(prayer) {
            const banner = document.getElementById('notificationBanner');
            const text = document.getElementById('bannerText');

            const prayerNames = {
                imsak: 'Imsak',
                subuh: 'Subuh',
                zohor: 'Zohor',
                asar: 'Asar',
                maghrib: 'Maghrib',
                isyak: 'Isyak'
            };

            text.textContent = `🕌 Telah masuk waktu  ${prayerNames[prayer]}!`;
            banner.classList.add('show');

            console.log(`Notification shown for ${prayerNames[prayer]}`);

            // Auto-hide after 15 seconds
            setTimeout(() => {
                banner.classList.remove('show');
            }, 15000);
        }


        // Add click handler to enable audio on first user interaction
        document.addEventListener('DOMContentLoaded', function () {
            document.body.addEventListener('click', function enableAudio() {
                const audio = document.getElementById('azanAudio');
                if (audio) {
                    audio.load();
                    console.log('Audio enabled after user interaction');
                }
                // Remove this listener after first click
                document.body.removeEventListener('click', enableAudio);
            }, { once: true });
        });


        function render() {
            const grid = document.getElementById('scheduleGrid');
            let html = '';
            const dayNames = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
            const monthNames = ['JAN', 'FEB', 'MAC', 'APR', 'MEI', 'JUN', 'JUL', 'OGOS', 'SEPT', 'OKT', 'NOV', 'DIS'];

            // Gelung dari 0 (18 Feb) hingga 30 Ramadhan
            for (let i = 0; i <= 30; i++) {
                const dObj = new Date(2026, 1, 18 + i);
                const ds = `${dObj.getFullYear()}-${String(dObj.getMonth() + 1).padStart(2, '0')}-${String(dObj.getDate()).padStart(2, '0')}`;
                const s = slots[ds] || {};
                const isNightBefore = (i === 0);
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                if (dObj < today) continue;  // ← skips the card entirely

                html += `
                        <div class="day-card" ${isNightBefore ? 'style="border: 2px solid var(--gold);"' : ''}>
                            <div class="day-header">
                                <div class="ramadhan-info">
                                    <span class="ramadhan-num">${isNightBefore ? '🌙' : i}</span>
                                    <div class="date-text">
                                        ${dayNames[dObj.getDay()]}<br>
                                        ${dObj.getDate()} ${monthNames[dObj.getMonth()]}
                                        ${isNightBefore ? '<br><small>Malam Tarawih Pertama</small>' : ''}
                                    </div>
                                </div>
                                <span class="moon-icon">✨</span>
                            </div>
                            <div class="program-body">
                                ${s.KuliahSubuh ? `
                                    <div class="activity-item">
                                        <div class="act-details">
                                            <strong>Kuliah Subuh</strong>
                                            <div class="act-text">${s.KuliahSubuh}</div>
                                        </div>
                                        ${s.KuliahSubuhUrl ? `<img src="${s.KuliahSubuhUrl}" class="entry-img">` : ''}
                                    </div>` : ''}

                                ${s.Program ? `
                                    <div class="activity-item">
                                        <div class="act-details">
                                            <strong>Program Khas</strong>
                                            <div class="act-text">${s.Program}</div>
                                        </div>
                                        ${s.ProgramUrl ? `<img src="${s.ProgramUrl}" class="entry-img">` : ''}
                                    </div>` : ''}

                                ${s.Imam ? `
                                    <div class="activity-item">
                                        <div class="act-details">
                                            <strong>Imam & Bilal</strong>
                        <div class="act-text">${s.Imam} ${s.bilal ? `<br><small style="color:#666">Bilal: ${s.bilal}</small>` : ''}</div>
                                        </div>
                                        ${s.ImageUrl ? `<img src="${s.ImageUrl}" class="entry-img">` : ''}
                                    </div>` : ''}
                            </div>

                           ${!isNightBefore && i !== 29 && i !== 30 ? `
                            <div class="ifthar-section">
                                <div class="host-info">
                                    <div style="font-size:0.6rem; color:#666; text-transform:uppercase; font-weight:800;">Tajaan Iftar</div>
                                    <div class="host-name">${s.HostName || 'MASIH KOSONG'}</div>
                                </div>
                                ${!s.HostName ? `<button class="book-btn" onclick="handleBooking('${ds}')">Tempah</button>` : '<span>🍛</span>'}
                            </div>` : (i === 29 || i === 30) ? `
<div class="ifthar-section" style="background: rgba(255,255,255,0.5); justify-content: center;">
    <div style="font-size:0.7rem; font-weight:bold; color:var(--text-muted);">Tiada Iftar</div>
</div>` : `
                            <div class="ifthar-section" style="background: rgba(255,255,255,0.5); justify-content: center;">
                                <div style="font-size:0.7rem; font-weight:bold; color:var(--text-muted);">Mula Tarawih Malam Ini</div>
                            </div>`}
                        </div>`;
            }
            grid.innerHTML = html;
        }

        async function verifyAdmin(isSilent = false) {
            const pass = document.getElementById('adminPassword').value;
            const btn = document.getElementById('loginBtn');

            if (!pass || pass.trim() === "") {
                if (!isSilent) alert('Sila masukkan kata laluan!');
                return;
            }
            if (!isSilent) btn.innerText = "Mengesahkan...";

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ type: "verify_login", password: pass })
                });

                const data = await res.json();

                if (data.result === "Valid") {
                    // Simpan sesi
                    localStorage.setItem('adminPass', pass);
                    sessionStorage.setItem('adminPass', pass);

                    if (!isSilent) {
                        // Terus ke halaman jadual selepas berjaya
                        window.location.href = 'admin-schedule.html';
                    }
                } else {
                    if (!isSilent) alert("Kata laluan salah!");
                    localStorage.removeItem('adminPass');
                }
            } catch (e) {
                console.error("Ralat sambungan", e);
            }
            btn.innerText = "Log Masuk";
        }

        function populateAdminForm() {
            const select = document.getElementById('adminDateSelect');
            select.innerHTML = "";
            Object.keys(slots).sort().forEach(d => {
                const opt = document.createElement('option');
                opt.value = d; opt.innerText = d; select.appendChild(opt);
            });
            select.onchange = () => {
                const s = slots[select.value] || {};
                document.getElementById('admHost').value = s.HostName || "";
                document.getElementById('admContact').value = s.HostContact || "";
                document.getElementById('admImam').value = s.Imam || "";
                document.getElementById('admProgram').value = s.Program || "";
                document.getElementById('admImageUrl').value = s.ImageUrl || "";
                document.getElementById('admProgramUrl').value = s.ProgramUrl || "";
                document.getElementById('admKuliahSubuh').value = s.KuliahSubuh || "";
                document.getElementById('admKuliahSubuhUrl').value = s.KuliahSubuhUrl || "";
            };
            if (select.options.length > 0) select.onchange();
        }

        async function submitAdminUpdate() {
            const btn = document.getElementById('admSubmitBtn');
            const originalText = btn.innerText;
            btn.innerText = "Menyimpan...";

            // Ambil nilai daripada form admin
            const payload = {
                type: "admin_update",
                password: document.getElementById('adminPassword').value,
                selectedDate: document.getElementById('adminDateSelect').value,
                hostName: document.getElementById('admHost').value,
                hostContact: document.getElementById('admContact').value,
                imam: document.getElementById('admImam').value,
                program: document.getElementById('admProgram').value,
                imageUrl: document.getElementById('admImageUrl').value,
                programUrl: document.getElementById('admProgramUrl').value,
                kuliahSubuh: document.getElementById('admKuliahSubuh').value,
                kuliahSubuhUrl: document.getElementById('admKuliahSubuhUrl').value
            };

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const data = await res.json(); // Pastikan parse sebagai JSON

                if (data.result === "Success") {
                    alert("✅ Jadual berjaya dikemaskini!");
                    // Muat semula data tanpa reload seluruh halaman
                    await loadData();
                } else {
                    alert("❌ Gagal: " + (data.message || "Sila semak kata laluan atau sambungan."));
                }
            } catch (e) {
                console.error("Ralat Admin:", e);
                alert("❌ Ralat sambungan ke server.");
            } finally {
                btn.innerText = originalText;
            }
        }

        document.getElementById('bookingForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Memproses...";

            const payload = {
                selectedDate: document.getElementById('selectedDate').value, // Pastikan format YYYY-MM-DD
                hostName: document.getElementById('hostName').value,
                hostContact: document.getElementById('hostContact').value
            };

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const responseData = await res.json(); // Ambil respon JSON

                if (responseData.result === "Success") {
                    alert("Tempahan berjaya!");
                    closeModal('bookingModal');
                    loadData();
                } else {
                    alert("Gagal: " + (responseData.message || "Sila cuba lagi."));
                }
            } catch (e) {
                alert("Ralat sambungan. Sila pastikan Apps Script telah di-deploy semula.");
            } finally {
                btn.innerText = "Sahkan";
            }
        };

        function handleBooking(date) { document.getElementById('selectedDate').value = date; document.getElementById('displayDate').innerText = "Tarikh: " + date; document.getElementById('bookingModal').style.display = 'flex'; }
        function openAdminLogin() {
            // Periksa jika kata laluan sudah disimpan dalam localStorage
            const savedPass = localStorage.getItem('adminPass') || sessionStorage.getItem('adminPass');

            if (savedPass) {
                // Jika sesi wujud, terus ke halaman pengurusan jadual
                window.location.href = 'admin-schedule.html';
            } else {
                // Jika tiada sesi, buka modal log masuk seperti biasa
                document.getElementById('adminModal').style.display = 'flex';
            }
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        // 1. Function to switch between Schedule and Finance tabs
        function switchTab(tabName) {
            // Toggle Visibility
            document.getElementById('tab-schedule').classList.toggle('hidden', tabName !== 'schedule');
            document.getElementById('tab-finance').classList.toggle('hidden', tabName !== 'finance');

            // Update Button Styles
            document.getElementById('btn-tab-schedule').classList.toggle('active', tabName === 'schedule');
            document.getElementById('btn-tab-finance').classList.toggle('active', tabName === 'finance');
        }

        // 2. Updated Donation Upload Logic
        async function submitDonationUpdate() {
            const btn = document.getElementById('donSubmitBtn');
            const status = document.getElementById('financeStatus');
            const fileInput = document.getElementById('receiptFile');
            const file = fileInput.files[0];

            btn.innerText = "Memproses...";
            status.innerText = "Sila tunggu, sedang memuat naik...";
            let fileData = null;

            if (file) {
                const reader = new FileReader();
                fileData = await new Promise((resolve) => {
                    reader.onload = (e) => resolve(e.target.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
            }

            const payload = {
                type: "donation_update",
                id: btn.dataset.editId || null, // Include ID if editing
                existingFileUrl: btn.dataset.existingFile || "",
                password: document.getElementById('adminPassword').value,
                category: document.getElementById('donCategory').value,
                amount: document.getElementById('donAmount').value,
                donorName: document.getElementById('donDonorName').value,
                payDate: document.getElementById('donPayDate').value,
                fileName: file ? file.name : "",
                mimeType: file ? file.type : "",
                fileData: fileData
            };

            try {
                const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.text();
                if (result === "Success") {
                    status.style.color = "green";
                    status.innerText = "✅ Berjaya! Maklumat resit telah disimpan.";
                    // Reset for next entry
                    document.getElementById('donAmount').value = "";
                    fileInput.value = "";
                    await loadData();
                } else {
                    status.style.color = "red";
                    status.innerText = "❌ Gagal: " + result;
                }
            } catch (e) {
                status.style.color = "red";
                status.innerText = "❌ Ralat sambungan.";
            }
            btn.innerText = "Simpan Resit";
        }

        loadData();
    </script>
</body>
